name: Template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Run repository self-checks
        run: bash scripts/test_template.sh

      - name: Check Python syntax
        run: python3 -c 'import ast, pathlib; [ast.parse(p.read_text(encoding="utf-8")) for p in [pathlib.Path("setup_graphify_apx.py"), *pathlib.Path("scripts").glob("*.py")]]'

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Run native PowerShell checks
        shell: pwsh
        run: ./scripts/test_template.ps1
